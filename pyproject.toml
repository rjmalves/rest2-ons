[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rest2-ons"
description = "ML generalization of the REST2 radiation with learnable parameters for using with the ECMWF CAMS forecasts, COD forecasts and in-site measured data."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "numpy>=2.3.2",
    "pandas>=2.3.3",
    "plotly>=6.2.0",
    "polars>=1.31.0",
    "pyarrow>=21.0.0",
    "pyjson5>=2.0.0",
    "python-dotenv>=1.1.1",
    "pytz>=2025.2",
    "requests>=2.32.4",
    "scipy>=1.16.3",
    "statsmodels>=0.14.5",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "s3fs>=2024.10.0"
]

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
include = [
  "app/",
  "main.py"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "moto[s3]>=5.1.17",
    "mypy>=1.20.2,<2",
    "pandas-stubs>=2.3.2.250926",
    "boto3-stubs>=1.41.3",
    "scipy-stubs>=1.16.3.3,<1.17",
    "plotly-stubs>=0.1.4,<0.2",
    "ruff>=0.17.3,<1",
]

[project.scripts]
rest2-ons = "main:main"

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
# PGH bans blanket suppressions: every `# noqa` and `# type: ignore` names
# its code. ERA bans commented-out code; git keeps old versions.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "DTZ", "T20", "PGH", "ERA",
]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Timestamps are naive and mean UTC throughout rest2's data contract, so test
# inputs build naive datetimes on purpose. app/ and main.py keep the rule.
"tests/**" = ["DTZ"]
# The scripts/ci gates and the test-data generator report on stdout by design.
"scripts/**" = ["T201"]
"tests/fixtures/generate_test_data.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# s3fs ships no type information and has no stubs package.
module = ["s3fs", "s3fs.*"]
ignore_missing_imports = true

[tool.coverage.report]
# A ratchet at the measured baseline: raise it when coverage rises, never
# lower it to land a change.
fail_under = 94
