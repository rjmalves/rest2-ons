[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rest2-ons"
description = "ML generalization of the REST2 radiation with learnable parameters for using with the ECMWF CAMS forecasts, COD forecasts and in-site measured data."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "numpy>=2.3.2",
    "pandas>=2.3.3",
    "plotly>=6.2.0",
    "polars>=1.31.0",
    "pyarrow>=21.0.0",
    "pytz>=2025.2",
    "scipy>=1.16.3",
    "statsmodels>=0.14.5",
    "click>=8.2",
    "nwp-core[cli,skill]>=0.5.0,<0.6",
    "pydantic>=2.11,<3",
    "pydantic-core>=2.33,<3",
]

[tool.uv]
required-version = ">=0.9.22"
build-constraint-dependencies = [
    "hatchling==1.33.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]

[tool.uv.sources]
nwp-core = { git = "https://github.com/rjmalves/nwp-core.git", rev = "956c56b66e2d3d893c5542e9114c07151d062219" }

[tool.hatch.version]
path = "src/rest2_ons/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rest2_ons"]

[tool.hatch.build.targets.sdist]
only-include = ["src/rest2_ons", "README.md", "LICENSE", "CHANGELOG.md"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "moto[s3]>=5.1.17",
    "mypy>=1.20.2,<2",
    "pandas-stubs>=2.3.2.250926",
    "scipy-stubs>=1.16.3.3,<1.17",
    "plotly-stubs>=0.1.4,<0.2",
    "ruff>=0.17.3,<1",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
rest2-ons = "rest2_ons._cli:main"

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
# PGH bans blanket suppressions: every `# noqa` and `# type: ignore` names
# its code. ERA bans commented-out code; git keeps old versions.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "DTZ", "T20", "PGH", "ERA",
]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Timestamps are naive and mean UTC throughout rest2's data contract, so test
# inputs build naive datetimes on purpose. src/rest2_ons keeps the rule.
"tests/**" = ["DTZ"]
# The scripts/ci gates, the ci/ checks and the test-data generator report on
# stdout by design.
"scripts/**" = ["T201"]
"ci/**" = ["T201"]
"tests/fixtures/generate_test_data.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["rest2_ons"]

[tool.mypy]
strict = true
files = ["src/rest2_ons", "tests", "scripts/ci", "ci"]

[[tool.mypy.overrides]]
# pyarrow ships no type information and has no stubs package.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["rest2_ons"]
patch = ["subprocess"]

[tool.coverage.report]
# A ratchet at the measured baseline: raise it when coverage rises, never
# lower it to land a change.
fail_under = 94

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for full pipeline",
    "slow: Tests that take a long time to run",
    "s3: Tests that require S3/moto (AWS simulation)",
    "plotting: Tests that generate plots (skip on CI if needed)",
]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
